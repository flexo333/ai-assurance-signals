name: Collect

# Daily: fetch new items from the Sydney Lambda, analyse + ground them with
# Gemini here, and commit data/items/**. Spread daily so the weekly edition
# never depends on one run, and to stay inside the Gemini free tier.
#
# Needs secrets: PULUMI_ACCESS_TOKEN, GEMINI_API_KEY.

on:
  # PRs touching the pipeline get an end-to-end dry run on a few sources
  # (real Lambda + real Gemini, max 6 calls, nothing written or committed).
  pull_request:
    paths:
      - "pipeline/**"
      - "sources.yaml"
      - ".github/workflows/collect.yml"
  schedule:
    - cron: "41 19 * * *" # 06:41 AEDT / 05:41 AEST
  workflow_dispatch:
    inputs:
      since_days:
        description: "Window in days (blank = back to the archive start; feeds hold limited history anyway)"
        required: false
      max_calls:
        description: "Max Gemini calls this run"
        default: "120"
      only:
        description: "Comma-separated source ids (blank = all active)"
        required: false
      dry_run:
        description: "Analyse but don't write or commit"
        type: boolean
        default: false

permissions:
  contents: write  # commit data/items
  id-token: write  # assume the ingress infra role to invoke the Lambda
  pull-requests: write # required by the reusable deploy workflow

concurrency:
  group: collect-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  INGRESS_STACK: flexo333/flexo333-ingress/prod
  STACK: flexo333/flexo333-ai-assurance-signals/prod

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - run: npm ci

      - name: Test (pure modules)
        run: node --test

      - name: Build collect event
        env:
          SINCE: ${{ github.event_name == 'pull_request' && '30' || github.event.inputs.since_days }}
          MAX_ITEMS: ${{ github.event_name == 'pull_request' && '6' || github.event.inputs.max_calls || '120' }}
          ONLY: ${{ github.event_name == 'pull_request' && 'conversation-au,mit-tr,uk-dsit,innovationaus' || github.event.inputs.only }}
        run: node build-collect-event.mjs ${SINCE:+--since-days "$SINCE"} --max-items "$MAX_ITEMS" ${ONLY:+--only "$ONLY"} > event.json

      - name: Install Pulumi CLI
        uses: pulumi/actions@v7

      - name: Resolve role and function
        id: cfg
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          pulumi login
          echo "INFRA_ROLE_ARN=$(pulumi stack output infra_role_arn -s $INGRESS_STACK)" >> "$GITHUB_OUTPUT"
          echo "FN=$(pulumi stack output fetch_function_name -s $STACK)" >> "$GITHUB_OUTPUT"
          echo "REGION=$(pulumi stack output fetch_region -s $STACK)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.cfg.outputs.INFRA_ROLE_ARN }}
          aws-region: ${{ steps.cfg.outputs.REGION }}
          role-duration-seconds: 3600

      - name: Collect (Sydney Lambda)
        run: |
          aws lambda invoke \
            --function-name "${{ steps.cfg.outputs.FN }}" \
            --region "${{ steps.cfg.outputs.REGION }}" \
            --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 960 \
            --payload fileb://event.json \
            collected.json > invoke-meta.json
          cat invoke-meta.json
          if grep -q FunctionError invoke-meta.json; then head -c 4000 collected.json; exit 1; fi
          node -e 'const c=require("./collected.json"); console.log(`${c.location}: ${c.items.length} items, deferred ${c.deferred}`)'

      - name: Analyse + ground (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX: ${{ github.event_name == 'pull_request' && '6' || github.event.inputs.max_calls || '120' }}
          DRY: ${{ (github.event_name == 'pull_request' || github.event.inputs.dry_run == 'true') && '--dry-run' || '' }}
        run: node process.mjs collected.json --max "$MAX" $DRY

      - name: Commit items
        id: commit
        if: github.event_name != 'pull_request' && github.event.inputs.dry_run != 'true'
        working-directory: .
        run: |
          # data/seen only exists once a sitemap page has been rejected; stage it only if present.
          git add data/items
          [ -e data/seen ] && git add data/seen
          if git diff --cached --quiet; then echo "No new items."; echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0; fi
          git -c user.name="aisignals-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "data: collect $(date -u +%Y-%m-%dT%H:%MZ) ($(git diff --cached --name-only | wc -l) items)"
          for i in 1 2 3 4; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep $((i * 5))
          done
          exit 1

  # Daily redeploy keeps consultations ("open" is evaluated at build time),
  # key dates and the search index current between Friday editions.
  deploy:
    needs: collect
    if: github.event_name != 'pull_request' && github.event.inputs.dry_run != 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.collect.outputs.sha }}
    secrets: inherit
