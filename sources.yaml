# AI Assurance Signals — source allow-list.
#
# Content may ONLY come from sources listed here (see CLAUDE.md content rules).
#
# Fields
#   id            stable slug, used in item ids and the /sources page
#   name          display name
#   authority     official | standards | lab | research | industry | news | vendor
#                 industry = banks, insurers, super funds, FS peak bodies (own posts);
#                 vendor = cloud/enterprise vendor customer stories (#31)
#   sector        financial-services → items route to the Financial Services
#                 section and /financial-services/ tracker (#31)
#   must_match    regex string(s), case-insensitive; at least one must match the
#                 title + feed summary (sitemap: title + body) before the item is
#                 fetched or sent to Gemini. Protects quota on global feeds (#21, #31)
#   jurisdiction  AU-federal | AU-NSW | AU-VIC | AU-QLD | AU-WA | AU-SA | AU-TAS | AU-ACT | AU-NT
#                 | INTL | EU | UK | US | SG | CA | NZ
#   homepage      the page the checker fetches for feed autodiscovery
#   feeds         candidate RSS/Atom URLs (unverified guesses are fine; the
#                 checker also autodiscovers <link rel=alternate> and sitemaps)
#   ai_specific   true → every item is in scope; false → keyword pre-filter first
#   paywalled     true → headline + standfirst only, never full text
#   method        feed (default: configured feed → candidates → autodiscovery)
#                 | sitemap | listing | citizen-space | legislation
#   discover      false → skip homepage feed autodiscovery (method: feed)
#   listing       listing page URL(s) whose links are the articles (method: listing;
#                 include/exclude/max_pages as for sitemaps; dates from the page,
#                 or the /YYYY/MM/ in the URL)
#   sitemap       sitemap or sitemap-index URL(s) (method: sitemap)
#   include       regex a URL/title must match (method: sitemap | listing | citizen-space | legislation)
#   exclude       regex that rejects a URL/title, case-insensitive (sitemap | listing | citizen-space | legislation)
#   hosts         extra hostnames the source publishes on (seed URLs, #31)
#   max_pages     pages checked per run (method: sitemap | listing | legislation, default 25);
#                 for page sources the AI keyword check runs on the page BODY
#   status        active (default) | blocked | pending — blocked sources are listed on
#                 the /sources page for transparency but never fetched; their news
#                 reaches the digest through news coverage instead. pending = added
#                 but not yet verified by source-check: probed by source-check,
#                 never collected, until switched to active (#31)
#   blocked_reason why (from the Phase 1 source checks, 2026-11-24)
#
# Phase 1: `.github/workflows/source-check.yml` verifies every entry and
# records the working ingest method. Until then nothing here is verified.

