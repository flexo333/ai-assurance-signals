  - id: microsoft-customers
    name: Microsoft Cloud & Azure (Financial Services)
    authority: vendor
    jurisdiction: INTL
    homepage: https://www.microsoft.com/en-us/microsoft-cloud/blog/financial-services/
    feeds:
      - https://www.microsoft.com/en-us/microsoft-cloud/blog/feed/
      - https://azure.microsoft.com/en-us/blog/feed/
