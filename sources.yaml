    ai_specific: false
    must_match: &au_fs
      - "\\b(NAB|ANZ|Westpac|Macquarie|Suncorp|IAG|QBE|AMP|Bendigo|BOQ|ASX)\\b"
      - "\\b(National Australia Bank|Commonwealth Bank|CommBank|AustralianSuper|Aware Super|Australian Retirement Trust|HESTA|Insurance Australia)\\b"
      - "\\b(APRA|ASIC|AUSTRAC|Reserve Bank of Australia)\\b"
      - "\\bAustralia(n)?\\b"

